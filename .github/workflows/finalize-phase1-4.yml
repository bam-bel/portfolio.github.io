name: Finalize complete Phase 1-4 build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.head_commit.message != 'Finalize complete Phase 1-4 build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write final source and cutout
        shell: python
        env:
          HTML_B64: """

"""
          import base64, gzip
          html=gzip.decompress(base64.b64decode(HTML_B64)).decode('utf-8')
          p=Path('index.html'); p.write_text(html,encoding='utf-8')
      - name: Remove temporary workflows and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-full-phase1-4.yml .github/workflows/apply-phase34.yml .github/workflows/apply-smooth-geometry.yml .github/workflows/finalize-phase1-4.yml || true
          git config user.name 'bam bel'
          git config user.email 'bamlackbelay@gmail.com'
          git add -A
          git commit -m 'Apply full Phase 1-4 portfolio build' || true
          git push