name: Attach BB Lab enhancement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Attach enhancement script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="bb-lab-radial-enhancement.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/attach-radial-enhancement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html bb-lab-radial-enhancement.js .github/workflows/attach-radial-enhancement.yml
          git commit -m "feat: refine radial system with hybrid visual layer"
          git push