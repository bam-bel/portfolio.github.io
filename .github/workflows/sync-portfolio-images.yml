name: Sync portfolio image assets
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update website image references only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'img/safaricom_photo%20(1).jpg': 'img/safaricom_photo%20(1).jpg',
            'img/safaricom_photo_1.webp': 'img/safaricom_photo%20(2).jpg',
            'img/safaricom_photo_2.webp': 'img/safaricom_photo%20(3).jpg',
            'img/olympus_lockup2.png" alt="Olympus Group signage"': 'img/olympus_signage2.jpg" alt="Olympus Group signage"',
            'img/swed_rings.png" alt="Sweden–Ethiopia building"': 'img/swed_building.jpg" alt="Sweden–Ethiopia building"',
            'img/swed_signage.png" alt="Sweden–Ethiopia underpass"': 'img/swed_signage.png" alt="Sweden–Ethiopia signage"',
          }
          for old, new in replacements.items():
            s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit website image mapping and remove workflow
        shell: bash
        run: |
          git config user.name 'bam belay'
          git config user.email 'bamlackbelay@gmail.com'
          git add index.html
          git commit -m 'Sync website image sources from img repository' || true
          git rm .github/workflows/sync-portfolio-images.yml
          git commit -m 'Remove temporary image sync workflow' || true
          git push