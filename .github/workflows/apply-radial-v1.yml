name: Apply lean Radial System widget
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/radial_patch.py
      - name: Commit and clean up
        run: |
          rm -f .github/radial_patch.py .github/workflows/apply-radial-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/radial_patch.py .github/workflows/apply-radial-v1.yml
          git commit -m "Replace grid toy with performant radial system"
          git push
