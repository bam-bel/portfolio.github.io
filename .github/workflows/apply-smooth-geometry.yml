name: Apply smooth geometry
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  smooth-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply geometry-only overrides
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</style>'
          css = r'''
          /* Smooth geometry overrides — preserves the exact Midnight Navy design. */
          .index{border-radius:18px;overflow:hidden}
          .hero-image{border-radius:32px}
          .hero-image img{border-radius:32px}
          .marquee{border-radius:24px}
          .tdb{border-radius:22px;overflow:hidden}
          .filters{border-radius:0 0 20px 20px}
          .filter{border-radius:999px}
          .media{border-radius:20px}
          .media img{border-radius:20px}
          .engine{border-radius:18px;overflow:hidden}
          .metric{border-radius:16px}
          .seq{border-radius:18px;overflow:hidden}
          .media-card{border-radius:22px}
          .mood img{border-radius:18px}
          .small-entry img{border-radius:20px}
          .chain span{border-radius:999px}
          .card{border-radius:18px}
          .grid div{border-radius:4px}
          .swatch{border-radius:14px}
          .cap-node{border-radius:999px}
          .cap-detail{border-radius:14px}
          .project-status{border-radius:999px}
          '''
          if '/* Smooth geometry overrides' not in s:
              s = s.replace(marker, css + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit geometry update and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'bam bel'
          git config user.email 'bamlackbelay@gmail.com'
          git add index.html
          git commit -m 'Add rounded smooth geometry to Midnight Navy portfolio'
          git rm .github/workflows/apply-smooth-geometry.yml
          git commit -m 'Remove temporary geometry workflow'
          git push