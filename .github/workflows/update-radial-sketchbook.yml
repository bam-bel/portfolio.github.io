name: Build radial system sketchbook experiment
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-radial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Grid Generator with Radial System
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '<div class="card"><h4>Grid Generator</h4><div id="grid" class="grid"></div></div>'
          new = '''<div class="card radial-card"><div class="radial-head"><div><h4>Radial System</h4><div class="radial-kicker">Visual &amp; Frequency Reasoning</div></div><div class="radial-status" id="radialStatus">● SYSTEM ACTIVE</div></div><p class="radial-note">Derived from a radial geometric study explored in my identity work.</p><div class="radial-stage"><svg id="radialSvg" viewBox="0 0 420 240" role="img" aria-label="Interactive concentric radial geometry experiment"><g id="radialGuides"></g><g id="radialPoints"></g></svg></div><div class="radial-controls"><label><span>Frequency <b id="freqValue">24</b></span><input id="radialFreq" type="range" min="6" max="64" value="24"></label><label><span>Amplitude <b id="ampValue">12</b><small>px</small></span><input id="radialAmp" type="range" min="0" max="24" value="12"></label></div><div class="radial-actions"><button id="pointLock" class="radial-toggle active" type="button">Point Lock <span>ON</span></button><button id="breakRadial" class="radial-break" type="button">Break Rule ↗</button></div><div class="radial-telemetry"><span id="radialTelemetry">R:72 / 48 / 84 · F:24 · A:12 · P:LOCKED</span><span id="radialState">NORMAL</span></div></div>'''
          if old not in s:
              raise SystemExit('Grid Generator block not found; refusing to change unrelated content.')
          s = s.replace(old, new, 1)

          css = '''\n/* Radial System / Sketchbook experiment */\n.radial-card{position:relative;overflow:hidden}.radial-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.radial-kicker{font:9px var(--fm);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}.radial-status{font:8px var(--fm);color:var(--accent);white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;padding-top:5px}.radial-note{font:10px/1.5 var(--fb);color:var(--muted);max-width:34ch;margin:6px 0 14px}.radial-stage{height:190px;display:grid;place-items:center;background:transparent;overflow:hidden}.radial-stage svg{width:100%;height:100%;max-height:190px;overflow:visible}.radial-guide{fill:none;stroke:var(--line);stroke-width:1;opacity:.65}.radial-axis{stroke:var(--line);stroke-width:1;stroke-dasharray:2 6;opacity:.35}.radial-wave{fill:none;stroke:var(--accent);stroke-width:1.4;opacity:.72;vector-effect:non-scaling-stroke}.radial-point{fill:var(--stone);opacity:.9}.radial-point.hot{fill:var(--accent)}.radial-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}.radial-controls label{display:block}.radial-controls label>span{display:flex;justify-content:space-between;align-items:center;font:9px var(--fm);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}.radial-controls b{color:var(--ink);font-weight:500}.radial-controls small{font-size:8px;color:var(--muted);margin-left:2px}.radial-controls input{width:100%;accent-color:var(--accent)}.radial-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:13px}.radial-toggle,.radial-break{border:0;background:none;font:9px var(--fm);text-transform:uppercase;letter-spacing:.06em;cursor:pointer;padding:0}.radial-toggle{color:var(--muted)}.radial-toggle span{color:var(--accent)}.radial-toggle:not(.active) span{color:var(--muted)}.radial-break{color:var(--accent)}.radial-break:hover{text-decoration:underline;text-underline-offset:4px}.radial-telemetry{display:flex;justify-content:space-between;gap:10px;margin-top:12px;padding-top:9px;border-top:1px solid var(--line);font:8px var(--fm);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.radial-telemetry span:last-child{color:var(--accent)}@media(max-width:900px){.radial-stage{height:180px}.radial-controls{grid-template-columns:1fr}.radial-telemetry{flex-direction:column;gap:4px}}\n'''
          marker = '</style></head>'
          if '/* Radial System / Sketchbook experiment */' not in s:
              s = s.replace(marker, css + marker, 1)

          js = '''\n(function(){\n  const svg=document.getElementById('radialSvg');\n  if(!svg) return;\n  const guides=document.getElementById('radialGuides');\n  const points=document.getElementById('radialPoints');\n  const freq=document.getElementById('radialFreq');\n  const amp=document.getElementById('radialAmp');\n  const freqValue=document.getElementById('freqValue');\n  const ampValue=document.getElementById('ampValue');\n  const lock=document.getElementById('pointLock');\n  const brk=document.getElementById('breakRadial');\n  const status=document.getElementById('radialStatus');\n  const state=document.getElementById('radialState');\n  const telemetry=document.getElementById('radialTelemetry');\n  const NS='http://www.w3.org/2000/svg';\n  const cx=210,cy=120,radii=[42,70,98];\n  let phase=0,last=performance.now(),locked=true,breaking=false,breakStart=0,settle=0;\n  const mk=(tag,attrs={})=>{const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));return e};\n  radii.forEach((r,i)=>{guides.appendChild(mk('circle',{cx,cy,r,class:'radial-guide'}));});\n  guides.appendChild(mk('line',{x1:cx-110,y1:cy,x2:cx+110,y2:cy,class:'radial-axis'}));\n  guides.appendChild(mk('line',{x1:cx,y1:cy-110,x2:cx,y2:cy+110,class:'radial-axis'}));\n  const wave=mk('path',{class:'radial-wave'});guides.appendChild(wave);\n  const render=(t)=>{\n    const f=+freq.value,a=+amp.value;\n    const dt=Math.min(40,t-last);last=t;\n    phase += dt*0.00055*(breaking?1.85:1);\n    if(breaking){\n      const elapsed=(t-breakStart)/1500;\n      if(elapsed<1){\n        settle=Math.sin(elapsed*Math.PI/2);\n      }else{\n        settle=1;\n      }\n    }\n    freqValue.textContent=f;ampValue.textContent=a;\n    const lockedPhase=locked?0:0.18;\n    const ampFactor=breaking?(1+0.9*Math.min(1,settle)):1;\n    let d='';\n    for(let j=0;j<=f;j++){\n      const ang=j*(Math.PI*2/f);\n      const wob= a*ampFactor*Math.sin(phase + j*0.32);\n      const rr=84+wob;\n      const x=cx+Math.cos(ang)*rr;\n      const y=cy+Math.sin(ang)*rr;\n      d+=(j?'L':'M')+x.toFixed(2)+' '+y.toFixed(2);\n    }\n    wave.setAttribute('d',d);\n    points.innerHTML='';\n    radii.forEach((base,ri)=>{\n      for(let j=0;j<f;j++){\n        const ang=j*(Math.PI*2/f);\n        let ringPhase=phase + (locked?0:ri*0.25);\n        let wob=a*(0.55+ri*0.2)*Math.sin(ringPhase+j*0.32);\n        if(breaking){\n          const directional=(j%Math.max(3,Math.round(f/8))===0)?(a*(1.3+ri*.45)*settle):0;\n          wob+=directional;\n        }\n        const rr=base+wob;\n        const x=cx+Math.cos(ang)*rr;\n        const y=cy+Math.sin(ang)*rr;\n        const escaped=breaking && Math.abs(wob)>a*1.65 && (j%Math.max(4,Math.round(f/7))===0);\n        const c=mk('circle',{cx:x.toFixed(2),cy:y.toFixed(2),r:escaped?'1.8':'1.5',class:'radial-point'+(j%Math.max(5,Math.round(f/9))===0?' hot':'')});\n        c.style.opacity=escaped?String(Math.max(.18,1-settle*.7)):'0.9';\n        points.appendChild(c);\n      }\n    });\n    telemetry.textContent='R:42 / 70 / 98 · F:'+f+' · A:'+a+' · P:'+(locked?'LOCKED':'FREE');\n    requestAnimationFrame(render);\n  };\n  lock.addEventListener('click',()=>{locked=!locked;lock.classList.toggle('active',locked);lock.querySelector('span').textContent=locked?'ON':'OFF'});\n  brk.addEventListener('click',()=>{\n    if(breaking) return;\n    breaking=true;breakStart=performance.now();status.textContent='● ANOMALY DETECTED';state.textContent='BREAK RULE';brk.textContent='Restore System ↗';\n    setTimeout(()=>{\n      breaking=false;\n      status.textContent='● SYSTEM ACTIVE';state.textContent='NEW STATE';brk.textContent='Break Rule ↗';\n    },2800);\n  });\n  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n  if(reduce){phase=0}\n  requestAnimationFrame(render);\n})();\n'''
          script_marker='</script>'
          if 'const svg=document.getElementById(\'radialSvg\')' not in s:
              s=s.replace(script_marker,js+script_marker,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit updated site and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'bam belay'
          git config user.email 'bamlackbelay@gmail.com'
          git add index.html
          git commit -m 'Replace grid sketchbook toy with radial system' || true
          git rm .github/workflows/update-radial-sketchbook.yml
          git commit -m 'Remove temporary radial sketchbook workflow' || true
          git push