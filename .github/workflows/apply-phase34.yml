name: Apply Phase 3-4 structure
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply-phase34:
    if: github.event.head_commit.message != 'Apply Phase 3-4 runtime to portfolio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Phase 3-4 runtime
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="phase34_structure.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Missing </body> marker')
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit wiring and remove workflow
        shell: bash
        run: |
          git config user.name 'bam bel'
          git config user.email 'bamlackbelay@gmail.com'
          git add index.html
          git commit -m 'Apply Phase 3-4 runtime to portfolio' || true
          git rm .github/workflows/apply-phase34.yml
          git commit -m 'Remove temporary Phase 3-4 workflow' || true
          git push
