name: Update image sources only

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update image references only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              'img/safaricom_photo.jpg': 'img/safaricom_photo%20(1).jpg',
              'img/olympus_signage2.jpg': 'img/olympus_lockup2.png',
              'img/swed_building.jpg': 'img/swed_rings.png',
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          # Replace the Safaricom sequence so each stage uses a different repository image.
          old_seq = '''<div class="sequence"><div class="seq"><img src="img/safaricom_photo%20(1).jpg" alt="Billboard concept"><label>Billboard</label></div><div class="seq"><img src="img/safaricom_photo%20(1).jpg" alt="Transit concept"><label>Transit</label></div><div class="seq"><img src="img/safaricom_photo%20(1).jpg" alt="Platform concept"><label>Platform</label></div><div class="seq"><img src="img/safaricom_photo%20(1).jpg" alt="Vehicle concept"><label>Vehicle</label></div></div>'''
          new_seq = '''<div class="sequence"><div class="seq"><img src="img/safaricom_photo%20(1).jpg" alt="Billboard concept"><label>Billboard</label></div><div class="seq"><img src="img/safaricom_photo%20(2).jpg" alt="Transit concept"><label>Transit</label></div><div class="seq"><img src="img/safaricom_photo%20(3).jpg" alt="Platform concept"><label>Platform</label></div><div class="seq"><img src="img/safaricom_photo.jpg" alt="Vehicle concept"><label>Vehicle</label></div></div>'''
          s = s.replace(old_seq, new_seq)

          # Use the specific Sweden signage image for the second application slot.
          s = s.replace('img/swed_underpass.jpg', 'img/swed_signage.png')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'bam belay'
          git config user.email 'bamlackbelay@gmail.com'
          git add index.html
          git commit -m 'Update portfolio image sources only' || true
          git rm .github/workflows/update-image-sources.yml
          git commit -m 'Remove temporary image update workflow' || true
          git push
