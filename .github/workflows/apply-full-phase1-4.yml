name: Apply full Phase 1-4 portfolio build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'Apply full Phase 1-4 portfolio build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply full combined build
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Font system: editorial body/display + technical mono; Montserrat only for roll hover.
          s=re.sub(r'https://fonts.googleapis.com/css2\?family=[^\" ]+', 'https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=Montserrat:wght@800;900&display=swap', s, count=1)
          s=re.sub(r'--fd:\'[^;]+;','--fd:\'Fraunces\',serif;',s, count=1)
          s=re.sub(r'--fb:\'[^;]+;','--fb:\'Inter\',-apple-system,sans-serif;',s, count=1)
          s=re.sub(r'--fm:\'[^;]+;','--fm:\'JetBrains Mono\',monospace;',s, count=1)

          # Phase 1: flat architectural surfaces, zero-line rhythm, stronger hierarchy.
          phase1=r'''<style id="phase1-final">
          :root{--radius-sm:0px!important;--radius:0px!important;--radius-lg:0px!important;--hover-cyan:#38bdf8}
          *,*:before,*:after{box-shadow:none!important;border-radius:0!important}
          .filter-bar{position:static!important;background:transparent!important;backdrop-filter:none!important;border:0!important}
          .filter-btn{border:0!important;background:transparent!important;padding:0!important}
          .project,.tdb,.flagship,.bridge,.work,.playground,.cap,.contact,.filter-bar,footer{border:0!important;border-top:0!important;border-bottom:0!important}
          .hero-title{font-size:clamp(2.9rem,7.6vw,7.2rem)!important;line-height:.92!important;letter-spacing:-.035em!important}
          .work-head h2{font-size:clamp(2.4rem,5vw,4.4rem)!important;line-height:.92!important;letter-spacing:-.035em!important}
          .bridge h3{font-size:clamp(2.2rem,4.6vw,3.8rem)!important;line-height:.94!important;letter-spacing:-.03em!important}
          .how-statement{font-size:clamp(2.2rem,5.8vw,4.8rem)!important;line-height:.96!important;letter-spacing:-.035em!important}
          .flagship h3{font-size:clamp(3rem,7vw,6.4rem)!important;line-height:.92!important;letter-spacing:-.035em!important}
          </style>'''
          if 'id="phase1-final"' not in s: s=s.replace('</head>',phase1+'</head>',1)

          # Phase 2 hero: starfield + isolated portrait + scroll transition.
          hero_start=s.find('<!-- ============================= HERO ============================= -->')
          tdb_start=s.find('<!-- ============================= THINK / DESIGN / BUILD ============================= -->')
          if hero_start>=0 and tdb_start>hero_start:
            hero=r'''<!-- ============================= HERO ============================= -->
          <header class="hero" id="top">
            <canvas id="starfield" class="hero-starfield" aria-hidden="true"></canvas>
            <div class="wrap hero-grid">
              <div class="hero-text" id="heroText">
                <div class="eyebrow reveal in">Business &amp; Product Analytics · Visual Design · Creative Strategy</div>
                <h1 class="hero-title reveal in">I make <em>complex</em><br>things clear.</h1>
                <div class="hero-sub reveal in reveal-d2">Systems · Products · Visual Experiences</div>
                <p class="hero-line reveal in reveal-d3">Beamlak Belay moves between strategy, analysis, brand identity, and visual craft — using structured thinking and applied technology to turn fragmented problems into legible systems.</p>
              </div>
              <div class="hero-portrait reveal in reveal-d2" id="heroPortrait"><img src="img/portrait-cutout-final.png" alt="Beamlak Belay"></div>
            </div>
          </header>
          
          '''
            s=s[:hero_start]+hero+s[tdb_start:]

          # Operating Mode: capabilities + filters live inside the editorial block.
          tdb_end=s.find('</section>', s.find('<section class="tdb"', tdb_start))
          if tdb_end>=0:
            meta=r'''<div class="phase34-operating-meta">
              <div class="phase34-capabilities"><span class="eyebrow">Capabilities</span><a href="#work" data-mode="strategy">Strategy</a><a href="#work" data-mode="analytics">Analytics</a><a href="#work" data-mode="brand">Brand</a><a href="#work" data-mode="campaign">Campaign</a><a href="#work" data-mode="digital">Digital</a><a href="#work" data-mode="spatial">Spatial</a><a href="#work" data-mode="technology">Technology</a></div>
              <div class="phase34-filters"><span class="eyebrow">Filter</span><div id="filterBar" class="filter-list"><button class="filter-btn active" data-filter="all">All</button><button class="filter-btn" data-filter="strategy">Strategy</button><button class="filter-btn" data-filter="analytics">Analytics</button><button class="filter-btn" data-filter="brand">Brand</button><button class="filter-btn" data-filter="campaign">Campaign</button><button class="filter-btn" data-filter="digital">Digital</button><button class="filter-btn" data-filter="spatial">Spatial</button></div></div>
            </div>'''
            s=s[:tdb_end+10]+meta+s[tdb_end+10:]
          # Remove old standalone filter blocks if present.
          s=re.sub(r'<div class="filters">.*?</div>\s*</div>','',s,flags=re.S)
          # Hide standalone capabilities block; operating mode now owns it.
          s=re.sub(r'<section class="cap" id="capabilities"[^>]*>','<section class="cap" id="capabilities" hidden>',s,count=1)
          s=s.replace('href="#capabilities"','href="#operating-mode"',1)
          s=s.replace('<section class="tdb">','<section class="tdb" id="operating-mode">',1)

          # Ensure a clean Featured Work wrapper exists around project list.
          if 'class="work-head"' not in s:
            first=s.find('<div class="project')
            career=s.find('<!-- ============================= CAREER OS FLAGSHIP ============================= -->')
            if first>=0 and career>first:
              s=s[:first]+'<section class="work" id="work"><div class="wrap"><div class="work-head"><h2>Featured Work</h2><div class="work-count">05 projects · status stays visible</div></div>\n'+s[first:career]+'</div></section>\n\n'+s[career:]

          # Standardize project labels.
          def add_work(m):
            n=m.group(1)
            return m.group(0)+'<div class="phase34-work-label">WORK / '+n.zfill(2)+'</div>'
          s=re.sub(r'(<div class="project-index">)(\d+)(</div>)\s*(<div class="project-body">)', lambda m: m.group(1)+m.group(2)+m.group(3)+m.group(4)+'<div class="phase34-work-label">WORK / '+m.group(2).zfill(2)+'</div>', s)

          # Career OS standardized intro + decision logic note.
          s=s.replace('<h3>Career OS</h3>\n    <p class="flagship-lede">','<div class="phase34-case-intro"><div><div class="phase34-case-label">CASE STUDY / 01</div><h3>Career OS</h3></div><p class="flagship-lede">',1)
          s=s.replace('before any solution gets designed.</p>\n\n    <div class="engine">','before any solution gets designed.</p></div>\n\n    <div class="engine">',1)
          metrics='''    <div class="metric-row">\n      <div class="metric-card"><div class="k">Framework</div><div class="v">TAM / SAM / SOM</div></div>\n      <div class="metric-card"><div class="k">Framework</div><div class="v">KPI Tree</div></div>\n      <div class="metric-card"><div class="k">Framework</div><div class="v">RICE Prioritization</div></div>\n    </div>'''
          if metrics in s and 'phase34-decision-note' not in s:
            s=s.replace(metrics,metrics+'\n    <div class="phase34-decision-note">DECISION LOGIC / FRAME → TEST → MODEL → PRIORITIZE → DECIDE</div>',1)

          # Safaricom distinct images when available in the repo.
          s=s.replace('img/safaricom_photo%20(1).jpg','img/safaricom_bus.jpg').replace('img/safaricom_photo%20(2).jpg','img/safaricom_billboard.jpg').replace('img/safaricom_photo%20(3).jpg','img/safaricom_terminal.jpg')

          # Radial System: replace Grid Generator only if it is still present.
          if 'Grid Generator' in s:
            s=s.replace('''<h4>Grid Generator</h4>\n        <div class="pg-controls">\n          <label>Columns <input type="range" id="gridCols" min="2" max="12" value="6"></label>\n          <label>Gap <input type="range" id="gridGap" min="0" max="20" value="6"></label>\n        </div>\n        <div class="pg-canvas" id="gridCanvas"></div>''','''<h4>Radial System</h4><div class="pg-radial-frame"><canvas id="radialCanvas"></canvas><div class="pg-status"><span class="pg-status-dot" id="radialStatusDot"></span><span id="radialStatusText">SYSTEM ACTIVE</span></div></div><div class="pg-controls"><label>Frequency <input type="range" id="radialFreq" min="6" max="64" value="32"><span id="radialFreqVal">32</span></label><label>Amplitude <input type="range" id="radialAmp" min="0" max="50" value="10"><span id="radialAmpVal">10</span></label></div><button id="radialBreak" class="pg-break-btn">Break Rule ↗</button><p class="radial-note">Derived from a radial geometric study. Manipulate the constraints, then break them.</p>''',1)
            s=re.sub(r'// ---- Playground: Grid Generator ----.*?\n\}\)\(\);\n\n', '', s, flags=re.S)

          # Add combined styling + scripts.
          css=r'''<style id="phase34-combined">
          .hero{background:radial-gradient(ellipse at 50% -10%,#1a2436 0%,var(--ink) 55%,#0a0e15 100%);overflow:hidden}.hero-starfield{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}.hero-grid{position:relative;z-index:1}.hero-portrait img{filter:none!important;mix-blend-mode:normal!important;box-shadow:none!important;border:0!important}.phase34-operating-meta{margin-top:72px}.phase34-capabilities{display:flex;gap:20px;flex-wrap:wrap;align-items:baseline}.phase34-capabilities a{font-family:var(--f-body);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-dim);transition:color .25s var(--ease)}.phase34-capabilities a:hover,.phase34-capabilities a:focus-visible{color:#38bdf8}.phase34-filters{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:26px}.phase34-filters .filter-list{display:flex;gap:18px;flex-wrap:wrap}.phase34-filters .filter-btn{font-family:var(--f-body);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.phase34-filters .filter-btn.active,.phase34-filters .filter-btn:hover{color:#38bdf8!important}.phase34-work-label{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--accent);margin-bottom:10px}.work{padding-top:72px}.work-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:48px}.work-head h2{font-family:var(--f-display);font-size:clamp(2.4rem,5vw,4.4rem);line-height:.92;letter-spacing:-.035em}.work-count{font-family:var(--f-body);font-size:12px;color:var(--ink-dim)}.phase34-case-intro{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:end}.phase34-case-label{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}.phase34-decision-note{margin-top:24px;font-family:var(--f-mono);font-size:10px;letter-spacing:.07em;color:var(--ink-dim);text-transform:uppercase}.radial-experiment .pg-radial-frame,.pg-radial-frame{position:relative;height:320px;background:var(--accent-dim);margin-bottom:20px;overflow:hidden}.pg-radial-frame canvas{display:block;width:100%;height:100%;cursor:crosshair}.pg-status{position:absolute;left:14px;bottom:12px;display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}.pg-status-dot{width:7px;height:7px;background:var(--accent)}.pg-status-dot.anomaly{background:#B3402C}.pg-break-btn{appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);font-family:var(--f-body);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:10px 18px;cursor:pointer}.pg-break-btn:hover{background:var(--ink);color:var(--bg)}.radial-note{margin-top:12px;font-size:12px;color:var(--ink-dim);max-width:52ch}.radial-experiment .pg-controls label span{font-family:var(--f-mono);font-size:10px;color:var(--accent)}@media(max-width:780px){.phase34-case-intro{grid-template-columns:1fr;gap:18px}.phase34-capabilities{gap:12px 18px}.work-head{align-items:flex-start;flex-direction:column}}
          </style>'''
          if 'id="phase34-combined"' not in s: s=s.replace('</head>',css+'</head>',1)

          scripts=r'''<script id="phase1-4-runtime">
          document.addEventListener('DOMContentLoaded',function(){
            var hero=document.querySelector('.hero'),nav=document.querySelector('nav'),sf=document.getElementById('starfield'),portrait=document.getElementById('heroPortrait'),heroText=document.getElementById('heroText');
            if(sf&&hero){var ctx=sf.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,dpr=Math.min(devicePixelRatio||1,2),stars=[],w=1,h=1;function rs(){w=hero.clientWidth;h=hero.clientHeight;sf.width=w*dpr;sf.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=[];for(var i=0,n=Math.round(w*h/9000);i<n;i++)stars.push({x:Math.random()*w,y:Math.random()*h,r:.3+Math.random()*1.3,a:.25+Math.random()*.5,p:Math.random()*Math.PI*2,s:.15+Math.random()*.4})}function draw(t){ctx.clearRect(0,0,w,h);for(var i=0;i<stars.length;i++){var q=stars[i],a=q.a+Math.sin(t*.001*q.s+q.p)*.25;ctx.fillStyle='rgba(244,241,236,'+Math.max(0,a)+')';ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill()}if(!reduced)requestAnimationFrame(draw)}rs();addEventListener('resize',rs);draw(0)}
            if(hero&&nav&&!reduced){var ticking=false;function sc(){if(ticking)return;ticking=true;requestAnimationFrame(function(){var p=Math.min(Math.max(scrollY/(hero.offsetHeight*.9),0),1);nav.classList.toggle('on-dark',scrollY<hero.offsetHeight-60);if(portrait){portrait.style.transform='scale('+(1-p*.35).toFixed(3)+') translateY('+(p*40).toFixed(1)+'px)';portrait.style.opacity=(1-p*.85).toFixed(3);portrait.style.filter='blur('+(p*6).toFixed(2)+'px)'}if(heroText){heroText.style.opacity=(1-p*.9).toFixed(3)}ticking=false})}addEventListener('scroll',sc,{passive:true});sc()}
            var bar=document.getElementById('filterBar');if(bar){var btns=bar.querySelectorAll('.filter-btn'),projects=document.querySelectorAll('.project');bar.addEventListener('click',function(e){var b=e.target.closest('.filter-btn');if(!b)return;btns.forEach(function(x){x.classList.remove('active')});b.classList.add('active');var f=b.dataset.filter;projects.forEach(function(p){var tax=(p.dataset.tax||'').split(' ');p.classList.toggle('hidden-by-filter',f!=='all'&&tax.indexOf(f)<0)})});document.querySelectorAll('.phase34-capabilities a[data-mode]').forEach(function(a){a.addEventListener('click',function(e){var b=bar.querySelector('.filter-btn[data-filter="'+a.dataset.mode+'"]');if(b){e.preventDefault();b.click();document.getElementById('work')?.scrollIntoView({behavior:'smooth'})}})})}
            var c=document.getElementById('radialCanvas'),f=document.getElementById('radialFreq'),a=document.getElementById('radialAmp'),br=document.getElementById('radialBreak');if(c&&f&&a&&br){var x=c.getContext('2d'),red=matchMedia('(prefers-reduced-motion: reduce)').matches,d=1,w=1,h=1,ph=0,broke=false,m={x:-9999,y:-9999},sys={freq:+f.value,amp:+a.value,s:red?0:.015,wb:0},tar={freq:+f.value,amp:+a.value,s:red?0:.03,wb:0},fv=document.getElementById('radialFreqVal'),av=document.getElementById('radialAmpVal'),dot=document.getElementById('radialStatusDot'),st=document.getElementById('radialStatusText');function rz(){var r=c.parentElement.getBoundingClientRect();d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0)}function lp(a,b,t){return a+(b-a)*t}function nz(i,r,p){return Math.sin(i*12.9898+r*78.233+p*1.731)*.5}c.addEventListener('mousemove',function(e){var r=c.getBoundingClientRect();m.x=e.clientX-r.left;m.y=e.clientY-r.top},{passive:true});c.addEventListener('mouseleave',function(){m.x=m.y=-9999});f.addEventListener('input',function(){if(!broke)tar.freq=+this.value;fv.textContent=this.value});a.addEventListener('input',function(){if(!broke)tar.amp=+this.value;av.textContent=this.value});br.addEventListener('click',function(){broke=true;br.disabled=true;br.textContent='RULE BROKEN';dot.classList.add('anomaly');st.textContent='ANOMALY DETECTED';sys.amp=150;sys.s=red?.01:.2;tar.amp=(+a.value)*2.5;tar.s=red?.002:.03;tar.wb=2.5});function dr(){x.fillStyle=red?'rgba(247,246,243,1)':'rgba(247,246,243,.18)';x.fillRect(0,0,w,h);sys.freq=lp(sys.freq,tar.freq,.05);sys.amp=lp(sys.amp,tar.amp,.012);sys.s=lp(sys.s,tar.s,.018);sys.wb=lp(sys.wb,tar.wb,.01);ph+=sys.s;var cx=w/2,cy=h/2,base=w*.12;x.fillStyle='rgba(17,23,33,.85)';for(var r=1;r<=4;r++){var rad=base*r,prev=null;for(var i=0;i<sys.freq;i++){var ang=i*(Math.PI*2/sys.freq),rr=rad+Math.sin(ph+i*.5+r)*sys.amp+(broke?nz(i,r,ph)*sys.wb*r*10:0),px=cx+Math.cos(ang)*rr,py=cy+Math.sin(ang)*rr,dist=Math.hypot(px-m.x,py-m.y);if(!red&&dist<100){var inf=Math.max(0,1-dist/100);rr+=(broke?-1:1)*inf*inf*18;px=cx+Math.cos(ang)*rr;py=cy+Math.sin(ang)*rr}if(prev&&!broke){x.strokeStyle='rgba(185,136,95,'+(1-r*.15)+')';x.lineWidth=.55;x.beginPath();x.moveTo(prev.x,prev.y);x.lineTo(px,py);x.stroke()}x.beginPath();x.arc(px,py,1.6,0,Math.PI*2);x.fill();prev={x:px,y:py}}}if(!red)requestAnimationFrame(dr)}rz();addEventListener('resize',rz);dr()}
            var rollSel=['.hero-title','.hero-sub','.tdb-label','.work-head h2','.project-body h3','.flagship h3','.how-statement','.bridge h3','.contact h2','.nav-links a','.filter-btn','.contact-links a'].join(',');document.querySelectorAll(rollSel).forEach(function(el){if(el.dataset.rollReady||!el.textContent.trim())return;el.dataset.rollReady='true';var html=el.innerHTML,stage=document.createElement('span'),normal=document.createElement('span'),hover=document.createElement('span');stage.className='roll-stage';normal.className='roll-line roll-normal';hover.className='roll-line roll-hover';normal.innerHTML=html;hover.innerHTML=html;hover.setAttribute('aria-hidden','true');stage.append(normal,hover);el.innerHTML='';el.appendChild(stage);el.classList.add('roll-target')});
          });
          </script>'''
          # CSS for roll + runtime.
          rollcss=r'''<style id="phase2-roll">.roll-target{font-family:'Montserrat',sans-serif!important;font-weight:800!important;display:block;overflow:hidden;position:relative}.roll-stage{display:block;position:relative;overflow:hidden;line-height:inherit}.roll-line{display:block;transition:transform .55s cubic-bezier(.16,1,.3,1)}.roll-hover{position:absolute;left:0;top:100%;width:100%;color:#38bdf8!important;font:inherit}.roll-target:hover .roll-normal,.roll-target:focus-visible .roll-normal{transform:translateY(-100%)}.roll-target:hover .roll-hover,.roll-target:focus-visible .roll-hover{transform:translateY(-100%)}.nav-links a{font-family:var(--f-body)!important;font-weight:600!important}</style>'''
          if 'id="phase1-4-runtime"' not in s: s=s.replace('</body>',scripts+rollcss+'</body>',1)
          # Remove only our known temporary write workflows so repo stays clean.
          for wf in ['.github/workflows/apply-phase34.yml','.github/workflows/apply-smooth-geometry.yml','.github/workflows/apply-full-phase1-4.yml']:
            q=Path(wf)
            if q.exists(): q.unlink()

          p.write_text(s,encoding='utf-8')
      - name: Commit final build and clean workflow
        shell: bash
        run: |
          git config user.name 'bam bel'
          git config user.email 'bamlackbelay@gmail.com'
          git add index.html
          git rm -f .github/workflows/apply-full-phase1-4.yml 2>/dev/null || true
          git add -A
          git commit -m 'Apply full Phase 1-4 portfolio build'
          git push